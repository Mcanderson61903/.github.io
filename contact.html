<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact Michael C Anderson — Cybersecurity & Criminal Justice Student at Grand Valley State University" />
    <title>Contact — Michael C Anderson</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <!-- ===== Header ===== -->
    <header class="header">
        <nav class="nav container">
            <a class="logo" href="index.html" aria-label="Home">
                <img src="assets/McA logo.png" alt="Michael Anderson Logo" width="50" height="50" />
                <span>
                    Michael C Anderson<br />
                    <small><em>Cybersecurity & Criminal Justice Student</em></small>
                </span>
            </a>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">☰</button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
            <button class="btn outline" id="themeToggle" aria-label="Toggle dark mode">🌓</button>
        </nav>
    </header>

    <!-- ===== Contact Section ===== -->
    <main class="container section">
        <h1 style="text-align:center;">Contact Me</h1>
        <p style="text-align:center; max-width:650px; margin:auto;">
            Have a question, opportunity, or file to share? Fill out this quick form and I’ll get back to you soon.
        </p>

        <form class="card contact-form" id="contactForm" action="https://formspree.io/f/xkgqvkoe" method="POST" enctype="multipart/form-data" style="max-width:600px;margin:2rem auto;display:flex;flex-direction:column;gap:1rem;">
            <label>
                <strong>Your Name</strong>
                <input type="text" name="name" placeholder="John Doe" required />
            </label>

            <label>
                <strong>Your Email</strong>
                <input type="email" name="email" placeholder="you@example.com" required />
            </label>

            <label>
                <strong>Your Message</strong>
                <textarea name="message" rows="5" placeholder="Write your message..." required></textarea>
            </label>

            <label>
                <strong>Attach a File (optional)</strong>
                <input type="file" name="upload" />
            </label>

            <button class="btn primary" type="submit" style="align-self:center;width:50%;">Send Message</button>
        </form>
    </main>

    <!-- ===== Footer ===== -->
    <footer class="footer">
        <div class="container footer-inner">
            <small>© <span id="year"></span> Michael C Anderson. All rights reserved.</small>
            <nav aria-label="Footer">
                <a href="projects.html">Projects</a>
                <a href="skills.html">Skills</a>
                <a href="contact.html" class="active">Contact</a>
                <a href="assets/MichaelAnderson_Resume.pdf" target="_blank" rel="noopener">Resume</a>
            </nav>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
